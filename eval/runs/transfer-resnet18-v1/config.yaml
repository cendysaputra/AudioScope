dataset:
  name: esc50
  root: data/esc50
features:
  sample_rate: 22050
  clip_seconds: 5.0
  n_fft: 1024
  hop_length: 512
  n_mels: 64
  f_min: 0.0
  f_max: null
  mel_scale: slaney
  mel_norm: slaney
  log: natural
  log_offset: 1.0e-06
  kind: logmel
  normalize: per_band
model:
  name: resnet
  arch: resnet18
  pretrained: imagenet
  weights_path: data/pretrained/resnet18-f37072fd.pth
  input_size:
  - 224
  - 224
  dropout: 0.2
  imagenet_norm: false
  gradcam_layer: backbone.layer4
augment:
  specaugment: true
  freq_mask_param: 8
  time_mask_param: 24
  num_freq_masks: 2
  num_time_masks: 2
train:
  seed: 0
  epochs: 30
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  warmup_epochs: 1
  val_fraction: 0.1
  early_stopping_patience: null
  freeze_backbone_epochs: 3
name: baseline
config_path: configs/transfer-resnet18.yaml
