<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1305" height="262" viewBox="0 0 1305 262" role="img" aria-labelledby="title desc">
<title id="title">AudioScope pipeline</title>
<desc id="desc">Audio clip is resampled, converted with an STFT and a mel filterbank into a log-mel spectrogram, classified by a CNN into top-k classes, with Grad-CAM overlay fed by the spectrogram and the CNN.</desc>
