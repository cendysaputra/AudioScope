<text x="425.0" y="64.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Arial, Helvetica, sans-serif" font-size="18">STFT</text>
<rect x="517" y="36" width="151" height="56" rx="6" ry="6" fill="#eef3fb" stroke="#3d4f66" stroke-width="1.5"/>
<text x="592.5" y="64.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Arial, Helvetica, sans-serif" font-size="18">Mel filterbank</text>
