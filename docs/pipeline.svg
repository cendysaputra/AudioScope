<line x1="1066" y1="64.0" x2="1112" y2="64.0" stroke="#2c3a4a" stroke-width="1.75" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="92" x2="1020.0" y2="170" stroke="#2c3a4a" stroke-width="1.75" marker-end="url(#arrow)"/>
<path d="M 821.0 92.0 L 821.0 184.0 Q 821.0 198.0 835.0 198.0 L 924.0 198.0" fill="none" stroke="#2c3a4a" stroke-width="1.75" marker-end="url(#arrow)"/>
<rect x="40" y="36" width="122" height="56" rx="6" ry="6" fill="#eef3fb" stroke="#3d4f66" stroke-width="1.5"/>
<text x="101.0" y="64.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Arial, Helvetica, sans-serif" font-size="18">Audio clip</text>
