<path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3a4a"/>
</marker>
</defs>
<line x1="162" y1="64.0" x2="208" y2="64.0" stroke="#2c3a4a" stroke-width="1.75" marker-end="url(#arrow)"/>
